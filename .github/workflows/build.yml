name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'VERSION'
      - '**.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 计算本次发布的版本号：仅在本工作流内部本地使用（用于打包产物与 release tag），
  # 绝不再 commit+push 回工作分支，避免污染 main。
  # 通过 ls-remote 查重，连续 push 时自动顺延到空闲版本号，避免 tag 冲突。
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.calc.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next free version
        id: calc
        shell: bash
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          echo "branch VERSION: $VER"
          IFS='.' read -r MAJ MIN PAT <<< "$VER"
          PAT=$((PAT + 1))
          NEW="$MAJ.$MIN.$PAT"
          # 若远程已存在同名 tag，继续 +1 直到找到空闲版本（不污染分支）
          while git ls-remote --tags --exit-code origin "v$NEW" >/dev/null 2>&1; do
            PAT=$((PAT + 1))
            NEW="$MAJ.$MIN.$PAT"
          done
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Resolved release version: v$NEW"

  build:
    name: Build (${{ matrix.os }})
    needs: [version]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - uses: actions/checkout@v4

      - name: Apply bumped version locally
        shell: bash
        run: echo "${{ needs.version.outputs.new }}" > VERSION

      - name: Setup Python (macOS — use Homebrew venv for Tk 9.0)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          # GitHub Actions 自带 Python 3.13 (Tk 8.6)，在 macOS 14+ 会崩溃
          # 改用 Homebrew 的 python-tk@3.13（绑定 Tk 9.0）
          brew install python-tk@3.13 || brew upgrade python-tk@3.13
          # 用 Homebrew Python 创建 venv（绕过 PEP 668 限制）
          BREW_PY="$(brew --prefix python@3.13)/bin/python3.13"
          VENV="$RUNNER_TEMP/pyvenv"
          "$BREW_PY" -m venv "$VENV"
          # 将 venv 的 bin 目录加入 PATH（后续步骤自动生效）
          echo "$VENV/bin" >> $GITHUB_PATH
          # 验证
          "$VENV/bin/python" --version
          "$VENV/bin/python" -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Setup Python (non-macOS)
        if: matrix.platform != 'macos'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-tk

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          pip install pyobjc-framework-Cocoa

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller main.spec

      - name: Package macOS .app as dmg
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          cd dist
          if [ -d "SSH Key Manager.app" ]; then
            echo "✅ .app Bundle 已生成"
            # 创建 .dmg（macOS 标准应用分发格式）
            hdiutil create -volname "SSH Key Manager" \
              -srcfolder "SSH Key Manager.app" \
              -ov -format UDZO \
              "ssh-key-manager-macos.dmg"
            echo "✅ 已打包为 ssh-key-manager-macos.dmg"
          else
            echo "❌ .app Bundle 未找到"
            ls -la
            exit 1
          fi

      - name: Verify build output
        if: matrix.platform != 'macos'
        shell: bash
        run: |
          echo "=== dist contents ==="
          ls -la dist/
          EXPECTED="ssh-key-manager-${{ matrix.platform }}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            EXPECTED="${EXPECTED}.exe"
          fi
          if [ -f "dist/${EXPECTED}" ]; then
            echo "✅ Single file build succeeded: dist/${EXPECTED}"
            file dist/${EXPECTED} || true
          else
            echo "❌ Expected file not found: dist/${EXPECTED}"
            echo "=== full dist listing ==="
            find dist/ -type f | head -50
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key-manager-${{ matrix.platform }}
          path: |
            dist/ssh-key-manager-${{ matrix.platform }}${{ matrix.platform == 'windows' && '.exe' || '' }}
            dist/ssh-key-manager-macos.dmg
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: [build, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 版本号由 version job 计算，直接复用，不再读取/回写分支 VERSION
      - name: Use computed version
        id: version
        shell: bash
        run: echo "current=${{ needs.version.outputs.new }}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Prepare release assets (direct executable)
        shell: bash
        run: |
          VER="v${{ steps.version.outputs.current }}"
          echo "=== release contents ==="
          find release/ -type f | head -20

          # Windows: 重命名为带版本号的文件名
          WIN_EXE="release/ssh-key-manager-windows/ssh-key-manager-windows.exe"
          if [ -f "$WIN_EXE" ]; then
            mv "$WIN_EXE" "release/ssh-key-manager-windows-${VER}.exe"
            echo "✅ Windows: release/ssh-key-manager-windows-${VER}.exe"
          else
            echo "❌ Windows exe not found"
            exit 1
          fi

          # Linux: 重命名为带版本号的文件名
          LIN_BIN="release/ssh-key-manager-linux/ssh-key-manager-linux"
          if [ -f "$LIN_BIN" ]; then
            chmod +x "$LIN_BIN"
            mv "$LIN_BIN" "release/ssh-key-manager-linux-${VER}"
            echo "✅ Linux: release/ssh-key-manager-linux-${VER}"
          else
            echo "❌ Linux binary not found"
            exit 1
          fi

          # macOS: 重命名 .dmg 为带版本号的文件名
          MAC_DMG="release/ssh-key-manager-macos/ssh-key-manager-macos.dmg"
          if [ -f "$MAC_DMG" ]; then
            mv "$MAC_DMG" "release/ssh-key-manager-macos-${VER}.dmg"
            echo "✅ macOS: release/ssh-key-manager-macos-${VER}.dmg"
          else
            echo "❌ macOS dmg not found"
            exit 1
          fi

          echo "=== final release assets ==="
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: v${{ steps.version.outputs.current }}
          body: |
            ## 🚀 SSH Key Manager v${{ steps.version.outputs.current }}

            > 自动构建于 `${{ github.sha }}`

            ### 下载
            | 平台 | 文件 |
            |---|---|
            | 🐧 Linux | `ssh-key-manager-linux-v${{ steps.version.outputs.current }}` |
            | 🪟 Windows | `ssh-key-manager-windows-v${{ steps.version.outputs.current }}.exe` |
            | 🍎 macOS | `ssh-key-manager-macos-v${{ steps.version.outputs.current }}.dmg` |

            ### 使用
            ```bash
            # Windows: 双击 ssh-key-manager-windows-*.exe
            # Linux: chmod +x ssh-key-manager-* && ./ssh-key-manager-*
            # macOS: 双击 .dmg，将 SSH Key Manager.app 拖入应用程序文件夹
            ```
          files: |
            release/ssh-key-manager-windows-v${{ steps.version.outputs.current }}.exe
            release/ssh-key-manager-linux-v${{ steps.version.outputs.current }}
            release/ssh-key-manager-macos-v${{ steps.version.outputs.current }}.dmg
          draft: false
          prerelease: false
